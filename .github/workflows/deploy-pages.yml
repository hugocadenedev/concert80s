name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static artifact
        run: |
          mkdir -p _site/uploads _site/screenshots
          cp *.html _site/
          cp support.js _site/
          cp *.png _site/ 2>/dev/null || true
          cp *.jpg _site/ 2>/dev/null || true
          cp *.jpeg _site/ 2>/dev/null || true
          cp *.mp4 _site/ 2>/dev/null || true
          cp .thumbnail _site/ 2>/dev/null || true
          cp -R uploads/. _site/uploads/ 2>/dev/null || true
          cp -R screenshots/. _site/screenshots/ 2>/dev/null || true
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4